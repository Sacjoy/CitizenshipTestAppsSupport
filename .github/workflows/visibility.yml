name: Visibility readiness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s _ops/tests -v
      - run: python3 _ops/check_visibility.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-readiness
          path: visibility-report.json
          retention-days: 30
  live:
    needs: source
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for this commit's Pages deployment
        run: python3 _ops/wait_for_pages.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python3 _ops/check_visibility.py --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-readiness
          path: visibility-report.json
          retention-days: 30
